name: Daily analysis by juche

on:
  schedule:
    # UTC 기준 07:30 (한국 시간 20:10) 평일 실행
    - cron: '10 11 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pandas selenium webdriver-manager openpyxl lxml

    - name: Run analysis script
      run: python juche.py  # 실행할 파이썬 파일명 확인 필수

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add stock_data.json
        git commit -m "Auto-update stock data: $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
        git push
